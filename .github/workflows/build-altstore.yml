name: Build AltStore

on:
  push:
    branches: [main]
    paths:
      - "AltStore/**"
      - "AltStoreCore/**"
      - "Shared/**"
      - "AltWidget/**"
      - "Dependencies/**"
      - "AltStore.xcodeproj/**"
      - "AltStore.xcworkspace/**"
      - "Podfile"
      - "Podfile.lock"
      - ".github/workflows/build-altstore.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options: [Debug, Release]

concurrency:
  group: build-altstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    env:
      SCHEME: AltStore
      WORKSPACE: AltStore.xcworkspace
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      - name: Build (unsigned, for device)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            | xcpretty --color || xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES ONLY_ACTIVE_ARCH=NO clean build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find "$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found under $DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos" >&2
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "AltStore-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-unsigned-ipa
          path: AltStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-dSYMs
          path: ${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIGURATION }}-iphoneos/*.dSYM
          if-no-files-found: ignore
          retention-days: 14
